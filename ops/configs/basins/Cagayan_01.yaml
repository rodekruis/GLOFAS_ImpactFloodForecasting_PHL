---
# Configuration for the Cagayan sub‑basin (placeholder values).

basin_id: Cagayan_01
country_iso3: PHL
# HydroBASINS level and ID must be set according to your basin delineation.
hydrobasins_level: 7
hydrobasins_id: 0  # TODO: replace with the actual HydroBASINS ID for this sub‑basin

# List of GloFAS station or grid cell identifiers associated with this basin.
# During calibration you should update this list to include all relevant point IDs.
glofas_point_ids:
  - PHL_00000  # TODO: replace with actual GloFAS point ID(s)

# The data_root specifies where to find input data (GloFAS reanalysis,
# forecast files, hazard layers, population rasters).  Adjust this path
# relative to the root of your project or mount a volume in production.
data_root: data  # place downloaded and processed data under the `data` folder

evt:
  method: POT-GPD
  threshold_m3s: 0.0  # to be determined during calibration
  run_length_days: 5
  gpd_shape_xi: 0.0    # to be determined
  gpd_scale_sigma: 1.0 # to be determined
  event_rate_per_year: 0.0 # to be determined

vulnerability:
  depth_threshold_m: 0.3
  impact_fraction: 1.0

trigger:
  impact_threshold_people: 100000
  probability_threshold: 0.3
  max_lead_time_days: 10
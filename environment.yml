name: PHLFlood
channels:
  - conda-forge
dependencies:
  - python=3.11
  # Core scientific computing
  - numpy
  - pandas
  - scipy
  - matplotlib
  # Array/netCDF handling
  - xarray
  - netcdf4
  - cftime
  # Geospatial processing
  - geopandas
  - rasterio
  - shapely
  - pyproj
  - pyogrio
  # GRIB file processing (critical for GloFAS data)
  - cfgrib
  - eccodes
  # Extreme value analysis (EVT/POT calibration)
  - pyextremes
  # Jupyter notebook support
  - jupyter
  - notebook
  - ipykernel
  - ipywidgets
  # System monitoring (optional but useful)
  - psutil
  # Utilities
  - pyyaml
  - python-dateutil
  # Package manager
  - pip
  - pip:
      - -e . --no-deps

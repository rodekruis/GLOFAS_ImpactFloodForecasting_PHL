name: PHLFlood
channels:
  - conda-forge
dependencies:
  - python=3.11
  # Core geohazard modeling framework
  - geopandas
  - rasterio
  - xarray
  - netcdf4
  # GRIB file processing (critical for GloFAS data)
  - cfgrib
  - eccodes
  # Jupyter notebook support
  - jupyter
  - notebook
  - ipykernel
  - ipywidgets
  # Package manager
  - pip
  - pip:
      # PhilFlood project (installs climada, climada-petals, pyextremes + all dependencies)
      - -e .
      # 4 CRITICAL packages (auto-included by PhilFlood but listed for transparency)
      - climada>=3.0.0
      - climada-petals>=1.0.0
      - pyextremes>=2.3.0

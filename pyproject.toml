[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "philflood"
version = "0.3.0"
description = "Impact-Based Forecasting system for flood early action in the Philippines"
readme = "README.md"
requires-python = ">=3.9"  # Code tested to work with Python 3.9.13 and later
authors = [
  {name = "David Urueña", email = "duruenaramirez@redcross.nl"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "climada>=3.0.0",
  "climada-petals>=1.0.0",
  "ipywidgets>=7.6.0",
  "pyextremes>=2.3.0",
]

[project.urls]
Source = "https://github.com/rodekruis/GLOFAS_ImpactFloodForecasting_PHL"
Issues = "https://github.com/rodekruis/GLOFAS_ImpactFloodForecasting_PHL/issues"

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "ruff>=0.1",
  "black>=24",
  "ipykernel>=6",
  "jupyterlab>=4",
  "matplotlib>=3.7",
]
ops = [
  "schedule>=1.2",
  "python-json-logger>=2.0",
  "typer>=0.12",
]

[project.scripts]
philflood = "philflood.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
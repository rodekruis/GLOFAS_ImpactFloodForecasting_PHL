[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "philflood"
version = "0.1.0"
description = "Impact-Based Forecasting system for flood early action in the Philippines"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "David Urueña", email = "duruenaramirez@redcross.nl"}
]
urls = {
  Source = "https://github.com/rodekruis/GLOFAS_ImpactFloodForecasting_PHL",
  Issues = "https://github.com/rodekruis/GLOFAS_ImpactFloodForecasting_PHL/issues",
}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "xarray>=2023.1",
  "netCDF4>=1.6",
  "cftime>=1.6",
  "geopandas>=0.14",
  "pyogrio>=0.8",
  "rasterio>=1.3",
  "shapely>=2.0",
  "pyproj>=3.5",
  "scipy>=1.9",
  "pyyaml>=6.0",
  "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "ruff>=0.1",
  "black>=24",
  "ipykernel>=6",
  "jupyterlab>=4",
  "matplotlib>=3.7",
]
ops = [
  "schedule>=1.2",
  "python-json-logger>=2.0",
  "typer>=0.12",
]

[project.scripts]
philflood = "philflood.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"